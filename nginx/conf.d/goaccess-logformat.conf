# Log format for GoAccess: identical to combined but substitutes CF-Connecting-IP
# for the first field so GoAccess sees real visitor IPs, not Cloudflare edge IPs.
# Uses $http_cf_connecting_ip instead of $remote_addr so the Cloudflare-IP
# allowlist (allow/deny on $remote_addr) in the vhost continues to work.
log_format goaccess_cf '$http_cf_connecting_ip - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"';
