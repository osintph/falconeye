server {
    listen 80;
    server_name falconeye.osintph.info;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name falconeye.osintph.info;

    ssl_certificate     /etc/ssl/falconeye/origin.crt;
    ssl_certificate_key /etc/ssl/falconeye/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Origin lock: only Cloudflare edge addresses may connect. REMOVE OR REPLACE
    # THIS INCLUDE IF YOU ARE NOT BEHIND CLOUDFLARE, otherwise every request is
    # denied. The file explains the alternatives, and "Deploying without
    # Cloudflare" in docs/deploy-runbook.md has a worked non-Cloudflare example.
    # This include is required: nginx -t fails if the snippet is not installed.
    include snippets/cloudflare-origin-allow.conf;

    client_max_body_size 2M;

    include snippets/security-headers.conf;

    location = /favicon.ico {
        alias /opt/falconeye/app_src/app/static/favicon-32x32.png;
        expires 7d;
        add_header Cache-Control "public, immutable";
        # Required: this location sets its own add_header, which would
        # otherwise discard every server-level security header.
        include snippets/security-headers.conf;
        access_log off;
    }

    location = /favicon.svg {
        alias /opt/falconeye/app_src/app/static/favicon.svg;
        expires 7d;
        add_header Cache-Control "public, immutable";
        # Required: this location sets its own add_header, which would
        # otherwise discard every server-level security header.
        include snippets/security-headers.conf;
        access_log off;
    }

    location /static/ {
        alias /opt/falconeye/app_src/app/static/;
        expires 1h;
        add_header Cache-Control "public";
        # Required: this location sets its own add_header, which would
        # otherwise discard every server-level security header.
        include snippets/security-headers.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        # Default "combined" format, which logs $remote_addr. Behind Cloudflare
        # that is the edge IP, not the visitor. To log real visitor IPs instead,
        # install nginx/conf.d/goaccess-logformat.conf and append goaccess_cf to
        # the line below. That is an optional step, documented under "GoAccess
        # log format" in docs/deploy-runbook.md. Do not name a log_format here
        # without shipping its definition: an undefined format is a hard nginx
        # startup error, not a warning.
        access_log /var/log/nginx/falconeye_access.log;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_connect_timeout 5s;
    }
}
