# Cloudflare origin lock: refuse any connection that did not come through the
# Cloudflare edge.
#
# WHAT IT DOES
# Allows only Cloudflare's published edge ranges and denies everything else, so
# the origin cannot be reached directly on its public IP. This is the first of
# two defences behind the per-IP rate limits: the second lives in the
# application (app/utils/cloudflare_ips.py) and holds even if this file is
# removed. See "Rate limiting" and "Origin protection" in README.md.
#
# IF YOU ARE NOT BEHIND CLOUDFLARE
# Remove the include line from nginx/falconeye.conf, or replace the ranges below
# with your own load balancer / VPC CIDRs. Leaving this file in place on a
# deployment that is not fronted by Cloudflare will deny every request, because
# no client will ever match. See "Deploying without Cloudflare" in
# docs/deploy-runbook.md before you change it.
#
# KEEPING IT IN STEP
# These ranges are the published lists from https://www.cloudflare.com/ips/
# (ips-v4 and ips-v6), verified 2026-09-21. They are kept identical to
# CLOUDFLARE_IPV4 and CLOUDFLARE_IPV6 in app/utils/cloudflare_ips.py, and
# tests/unit/test_client_ip.py fails if the two drift apart. Cloudflare changes
# these rarely; when it does, update both files together.

# IPv4 (https://www.cloudflare.com/ips-v4)
allow 103.21.244.0/22;
allow 103.22.200.0/22;
allow 103.31.4.0/22;
allow 104.16.0.0/13;
allow 104.24.0.0/14;
allow 108.162.192.0/18;
allow 131.0.72.0/22;
allow 141.101.64.0/18;
allow 162.158.0.0/15;
allow 172.64.0.0/13;
allow 173.245.48.0/20;
allow 188.114.96.0/20;
allow 190.93.240.0/20;
allow 197.234.240.0/22;
allow 198.41.128.0/17;

# IPv6 (https://www.cloudflare.com/ips-v6)
# Inert unless the server block also has an IPv6 listener, and harmless if not.
# Present so that adding "listen [::]:443 ssl;" does not silently lock out every
# IPv6 visitor at the moment it starts working.
allow 2400:cb00::/32;
allow 2405:8100::/32;
allow 2405:b500::/32;
allow 2606:4700::/32;
allow 2803:f800::/32;
allow 2a06:98c0::/29;
allow 2c0f:f248::/32;

deny all;
