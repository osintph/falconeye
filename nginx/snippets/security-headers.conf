# Security response headers, in a snippet because of how nginx inherits them.
#
# WHY THIS FILE EXISTS
# add_header is NOT additive across configuration levels. A location that sets
# any add_header of its own inherits NONE of the server-level ones. Before
# v3.32.2 the three static locations each set their own Cache-Control, so they
# silently dropped every header below: /static/app.js was served as JavaScript
# with no X-Content-Type-Options, no CSP and no HSTS, while "/" looked correct.
#
# So: include this at server level AND in every location that sets an
# add_header of its own. Adding an add_header to a location without also adding
# this include reintroduces the bug, and tests/unit/test_nginx_config.py fails
# if that happens.
#
# Note: script-src retains 'unsafe-inline' because the frontend uses inline
# onclick handlers. Removing it requires refactoring those to addEventListener
# bindings first.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://cdnjs.cloudflare.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com; img-src 'self' data: https:; connect-src 'self' https://api.pwnedpasswords.com; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;
# Permissions-Policy, added in v3.35.0 for the Route Map tab.
#
# Route Map asks for the visitor's location through navigator.geolocation, to
# draw the path from where they are and to pick a RIPE Atlas probe near them.
# Without geolocation=(self) the browser refuses the call before the user is
# ever asked, and the tab falls back to manual city selection for everyone.
#
# Only geolocation is named. A feature this header does not mention keeps the
# browser's own default, so naming one does not silently restrict the rest;
# adding further features here is a deliberate act, not a side effect.
# "self" means this origin only: an embedded third-party frame cannot use it,
# and frame-ancestors 'none' above means there are no frames anyway.
add_header Permissions-Policy "geolocation=(self)" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
