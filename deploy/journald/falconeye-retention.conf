# Journal retention for the box that runs FalconEye.
#
# Install to: /etc/systemd/journald.conf.d/falconeye-retention.conf
# Then:       sudo systemctl restart systemd-journald
#
# WHY THIS EXISTS
# Until v3.33.3 the application had no logging configuration, so no visitor
# lookup was recorded anywhere. v3.33.3 fixed the logging and, as a side effect,
# began persisting a stream of activity to the journal that had never been
# retained before. The values themselves are now hashed (see
# app/utils/logsafe.py), but "hashed and kept forever" is still a retention
# decision, and it should be a stated one.
#
# A SCOPE CAVEAT, READ THIS
# MaxRetentionSec is a journald setting, not a per-unit one. systemd has no
# per-unit retention: the only way to scope it to a single service is
# LogNamespace=, which gives the unit a separate journal that ordinary
# `journalctl -u falconeye` no longer reads. That trade is not worth it on a
# single-purpose box, so this applies to the WHOLE journal on this host. On a
# box running other services whose logs must be kept longer, use a namespace
# instead, or do not install this file.
[Journal]
# Discard journal data older than 14 days.
MaxRetentionSec=14d
# Bound the on-disk journal too, so a burst cannot fill the disk before the
# retention window closes.
SystemMaxUse=512M
